<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pickleball Court Reservation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #1a5c35; color: #1a202c; min-height: 100vh; }

    .court-bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    }
    .court-bg svg { width: 100%; height: 100%; }

    .header, .toolbar, .legend, .container { position: relative; z-index: 1; }

    .header {
      background: rgba(15, 40, 70, 0.92);
      backdrop-filter: blur(6px);
      color: white;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
    .header p { font-size: 13px; opacity: 0.65; margin-top: 3px; }

    .toolbar {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .toolbar label { font-size: 13px; color: #64748b; }
    .toolbar input[type="text"] {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 14px;
      width: 220px;
      transition: border-color 0.15s;
    }
    .toolbar input[type="text"]:focus { outline: none; border-color: #1a3a5c; }

    .connection-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #64748b;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #94a3b8;
      transition: background 0.3s;
    }
    .dot.connected    { background: #22c55e; }
    .dot.disconnected { background: #ef4444; }

    .legend {
      padding: 10px 28px;
      display: flex;
      gap: 18px;
      font-size: 12px;
      color: #e2f0e8;
      flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

    .container { padding: 20px 28px; overflow-x: auto; }

    table {
      border-collapse: separate;
      border-spacing: 0;
      min-width: 640px;
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }
    th {
      background: #1a3a5c;
      color: white;
      padding: 13px 14px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }
    th:first-child {
      text-align: left;
      background: #132d47;
      width: 110px;
    }
    td {
      padding: 8px;
      border: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    td:first-child {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      background: #f8fafc;
      padding-left: 18px;
      white-space: nowrap;
    }
    tr:hover td:not(:first-child) { background: #fafbfc; }

    /* Slot buttons */
    .slot-btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 7px;
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slot-btn:hover:not(:disabled) { opacity: 0.82; transform: scale(0.98); }
    .slot-btn:disabled { cursor: default; }
    .slot-available { background: #dcfce7; color: #15803d; }
    .slot-booked    { background: #fee2e2; color: #b91c1c; }
    .slot-mine      { background: #dbeafe; color: #1d4ed8; }

    /* Toast notification */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      max-width: 320px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    #toast.error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

    /* User count badge */
    .user-count {
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="court-bg" aria-hidden="true">
  <svg viewBox="0 0 440 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <rect width="440" height="200" fill="#1e6b3e"/>
    <rect x="20" y="10" width="400" height="180" fill="none" stroke="white" stroke-width="2.5"/>
    <line x1="20" y1="100" x2="420" y2="100" stroke="white" stroke-width="3.5"/>
    <rect x="16" y="94" width="8" height="12" fill="white" rx="1"/>
    <rect x="416" y="94" width="8" height="12" fill="white" rx="1"/>
    <line x1="20" y1="67" x2="420" y2="67" stroke="white" stroke-width="1.8"/>
    <line x1="20" y1="133" x2="420" y2="133" stroke="white" stroke-width="1.8"/>
    <line x1="220" y1="10" x2="220" y2="67" stroke="white" stroke-width="1.8"/>
    <line x1="220" y1="133" x2="220" y2="190" stroke="white" stroke-width="1.8"/>
  </svg>
</div>

<div class="header">
  <div>
    <h1>🏓 Pickleball Court Reservation</h1>
    <p>Book a court instantly — all users see updates in real time</p>
  </div>
  <div class="user-count" id="user-count">– users online</div>
</div>

<div class="toolbar">
  <label for="username">Your name:</label>
  <input type="text" id="username" placeholder="Enter your name to book..." maxlength="25"/>
  <div class="connection-status">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">Connecting...</span>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#dcfce7;border:1px solid #bbf7d0"></div>Available — click to book</div>
  <div class="legend-item"><div class="legend-dot" style="background:#dbeafe;border:1px solid #bfdbfe"></div>Your booking — click to cancel</div>
  <div class="legend-item"><div class="legend-dot" style="background:#fee2e2;border:1px solid #fecaca"></div>Taken by someone else</div>
</div>

<div class="container">
  <table id="grid">
    <thead><tr id="header-row"><th>Time</th></tr></thead>
    <tbody id="grid-body"></tbody>
  </table>
</div>

<div id="toast"></div>

<script>
  // ─── Constants (must match server.py) ──────────────────────────────────
  const COURTS = ["Court 1", "Court 2", "Court 3", "Court 4"];
  const SLOTS  = ["8:00 AM","9:00 AM","10:00 AM","11:00 AM",
                  "1:00 PM","2:00 PM","3:00 PM","4:00 PM","5:00 PM","6:00 PM"];

  let ws;
  let currentBookings = {};
  let toastTimer;

  // ─── Build the empty grid once ─────────────────────────────────────────
  function buildGrid() {
    const headerRow = document.getElementById('header-row');
    COURTS.forEach(c => {
      const th = document.createElement('th');
      th.textContent = c;
      headerRow.appendChild(th);
    });

    const tbody = document.getElementById('grid-body');
    SLOTS.forEach(slot => {
      const tr = document.createElement('tr');
      const timeTd = document.createElement('td');
      timeTd.textContent = slot;
      tr.appendChild(timeTd);

      COURTS.forEach(court => {
        const td = document.createElement('td');
        td.id = cellId(court, slot);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  function cellId(court, slot) {
    return 'cell_' + (court + '_' + slot).replace(/[^a-z0-9]/gi, '_');
  }

  // ─── Render the grid from booking state ────────────────────────────────
  function renderGrid(bookings) {
    currentBookings = bookings;
    const myName = document.getElementById('username').value.trim();

    COURTS.forEach(court => {
      SLOTS.forEach(slot => {
        const cell = document.getElementById(cellId(court, slot));
        if (!cell) return;

        const occupant = bookings[court]?.[slot];
        const btn = document.createElement('button');
        btn.className = 'slot-btn';

        if (!occupant) {
          btn.className += ' slot-available';
          btn.textContent = 'Available';
          btn.onclick = () => book(court, slot);
        } else if (myName && occupant === myName) {
          btn.className += ' slot-mine';
          btn.textContent = '✓ You — cancel?';
          btn.onclick = () => cancel(court, slot);
        } else {
          btn.className += ' slot-booked';
          btn.textContent = occupant;
          btn.disabled = true;
        }

        cell.innerHTML = '';
        cell.appendChild(btn);
      });
    });
  }

  // ─── Booking actions ────────────────────────────────────────────────────
  function book(court, slot) {
    const name = document.getElementById('username').value.trim();
    if (!name) {
      toast('Please enter your name first!', 'error');
      document.getElementById('username').focus();
      return;
    }
    ws.send(JSON.stringify({ type: 'book', court, slot, name }));
  }

  function cancel(court, slot) {
    const name = document.getElementById('username').value.trim();
    ws.send(JSON.stringify({ type: 'cancel', court, slot, name }));
  }

  // ─── WebSocket connection ───────────────────────────────────────────────
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);

    ws.onopen = () => {
      document.getElementById('status-dot').className = 'dot connected';
      document.getElementById('status-text').textContent = 'Connected';
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') {
        renderGrid(msg.bookings);
        if (msg.online !== undefined)
          document.getElementById('user-count').textContent = msg.online + ' user' + (msg.online !== 1 ? 's' : '') + ' online';
      } else if (msg.type === 'error') {
        toast(msg.msg, 'error');
      }
    };

    ws.onclose = () => {
      document.getElementById('status-dot').className = 'dot disconnected';
      document.getElementById('status-text').textContent = 'Disconnected — retrying...';
      setTimeout(connect, 2500);
    };
  }

  // ─── Toast notification ─────────────────────────────────────────────────
  function toast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.className = '', 3500);
  }

  // Re-render when user types their name (so their bookings highlight)
  document.getElementById('username').addEventListener('input', () => {
    if (Object.keys(currentBookings).length) renderGrid(currentBookings);
  });

  buildGrid();
  connect();
</script>
</body>
</html>
